<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDSTAR — Anonymous P2P Mesh</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #000; 
            color: #ff2222; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
            max-width: 850px; 
            margin: 0 auto; 
            text-shadow: 0 0 4px rgba(255, 0, 0, 0.8);
            position: relative;
            overflow-x: hidden;
        }

        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            opacity: 0.35;
        }

        .header {
            border-bottom: 2px solid #ff0000;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(8, 0, 0, 0.85);
            border-radius: 4px;
        }

        h2 { margin: 0; color: #ff0000; letter-spacing: 2px; }

        #chat-box { 
            border: 1px solid #aa0000; 
            height: 400px; 
            overflow-y: auto; 
            padding: 12px; 
            margin-bottom: 15px; 
            background: rgba(3, 0, 0, 0.9); 
            box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .msg { margin-bottom: 8px; word-break: break-all; color: #ff6666; }
        .self { color: #ffffff; font-weight: bold; }
        .system { color: #883333; font-style: italic; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        input { 
            background: rgba(5, 0, 0, 0.9); 
            border: 1px solid #aa0000; 
            color: #ff3333; 
            padding: 12px; 
            font-family: monospace; 
            outline: none;
        }
        input:focus { border-color: #ff0000; box-shadow: 0 0 8px rgba(255,0,0,0.8); }
        input[type="text"] { flex: 1; }
        
        button { 
            background: #ff0000; 
            color: #000; 
            border: none; 
            padding: 12px 24px; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: monospace;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }
        button:hover { background: #cc0000; color: #fff; }
    </style>
    <!-- PeerJS Kütüphanesi -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="header">
        <h2>[ ★ REDSTAR ]</h2>
        <span id="node-status" style="color:#aa0000; font-size:12px; font-weight:bold;">NODES: 0</span>
    </div>
    
    <p class="system" style="background: rgba(0,0,0,0.7); padding: 5px; margin-bottom:10px;">
        Kendi Peer ID'n: <span id="my-id" style="color:#fff;">Yükleniyor...</span>
    </p>

    <!-- Bağlantı Alanı -->
    <div class="input-group">
        <input type="text" id="target-id" placeholder="Arkadaşının Peer ID'sini buraya yapıştır...">
        <button onclick="connectToPeer()">BAĞLAN</button>
    </div>
    
    <div id="chat-box"></div>

    <div class="input-group">
        <input type="text" id="username" placeholder="Rumuz" value="Anon" style="max-width: 120px;">
        <input type="text" id="message" placeholder="Ağa mesaj bırak..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">GÖNDER</button>
    </div>

    <!-- Matrix Rain -->
    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*§ØΞΨ';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff0000';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);
    </script>

    <!-- WebRTC P2P Engine -->
    <script>
        const SHARED_PASS = 'RedStarStaticKey2026!';
        let peer = null;
        let connections = [];
        let cryptoKey = null;

        async function deriveKey(pass) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                "raw", enc.encode(pass), { name: "PBKDF2" }, false, ["deriveKey"]
            );
            return crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: enc.encode("REDSTAR_P2P_SALT_2026"),
                    iterations: 100000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptText(plainText) {
            const enc = new TextEncoder();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                cryptoKey,
                enc.encode(plainText)
            );
            const combined = new Uint8Array(iv.length + ciphertext.byteLength);
            combined.set(iv, 0);
            combined.set(new Uint8Array(ciphertext), iv.length);
            return Array.from(combined);
        }

        async function decryptText(combinedArray) {
            const dec = new TextDecoder();
            const data = new Uint8Array(combinedArray);
            const iv = data.slice(0, 12);
            const ciphertext = data.slice(12);
            const decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv },
                cryptoKey,
                ciphertext
            );
            return dec.decode(decrypted);
        }

        function log(text, isSystem = false, isSelf = false) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            if(isSystem) div.className = 'msg system';
            else if(isSelf) div.className = 'msg self';
            else div.className = 'msg';
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function updateNodeCount() {
            document.getElementById('node-status').innerText = `NODES: ${connections.length}`;
        }

        async function init() {
            log('[*] AES-GCM-256 Şifreleme anahtarları oluşturuluyor...', true);
            cryptoKey = await deriveKey(SHARED_PASS);

            // PeerJS sunucusuna bağlan
            peer = new Peer({
                config: {'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]}
            });

            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = id;
                log(`[★] Ağdaki benzersiz kimliğin oluşturuldu.`, true);
            });

            // Başkası sana bağlandığında
            peer.on('connection', (conn) => {
                setupConnection(conn);
                log(`[+] Dış düğüm sana bağlandı!`, true);
            });
        }

        function connectToPeer() {
            const targetId = document.getElementById('target-id').value.trim();
            if (!targetId) return log('[!] Lütfen geçerli bir Peer ID girin.', true);
            
            log(`[*] ${targetId} düğümüne bağlanılıyor...`, true);
            const conn = peer.connect(targetId);
            setupConnection(conn);
        }

        function setupConnection(conn) {
            conn.on('open', () => {
                connections.push(conn);
                updateNodeCount();
                log(`[✓] Bağlantı kuruldu! Uçtan uca şifreli sohbet aktif.`, true);
            });

            conn.on('data', async (data) => {
                try {
                    const decrypted = await decryptText(data);
                    const parsed = JSON.parse(decrypted);
                    log(`${parsed.user}: ${parsed.text}`);
                } catch (e) {
                    log(`[!] HATA: Şifresi çözülemeyen veri paketi.`, true);
                }
            });

            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                updateNodeCount();
                log(`[-] Bir düğüm ayrıldı.`, true);
            });
        }

        async function sendMsg() {
            const userInp = document.getElementById('username');
            const msgInp = document.getElementById('message');
            const text = msgInp.value.trim();
            const user = userInp.value.trim() || 'Anon';

            if (!text) return;
            if (connections.length === 0) {
                return log('[!] Bağlı düğüm yok. Arkadaşının ID\'sini girip BAĞLAN butonuna bas.', true);
            }

            const payload = JSON.stringify({ user, text });
            const encryptedPayload = await encryptText(payload);

            connections.forEach(conn => conn.send(encryptedPayload));
            log(`${user} (Siz): ${text}`, false, true);
            msgInp.value = '';
        }

        init();
    </script>
</body>
</html>
